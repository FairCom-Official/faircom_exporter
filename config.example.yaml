# FairCom Prometheus Exporter Configuration
# Complete example with all available options

# ============================================================================
# Server Configuration
# ============================================================================
server:
  # Port to listen on for metrics scraping
  port: 9100
  
  # Path where metrics are exposed
  path: /metrics
  
  # TLS configuration (optional, recommended for production)
  # Uncomment to enable HTTPS
  # tls:
  #   enabled: true
  #   cert_file: /etc/faircom_exporter/tls/server.crt
  #   key_file: /etc/faircom_exporter/tls/server.key
  
  # Basic authentication for metrics endpoint (optional)
  # Protects /metrics from unauthorized access
  # Uncomment to enable basic auth
  # basic_auth:
  #   username: prometheus
  #   password: changeme

# ============================================================================
# FairCom Database Connection
# ============================================================================
faircom:
  # Faircom server
  servername: FAIRCOMS@localhost
  # TLS configuration (optional, recommended for production)
  # Uncomment to enable HTTPS
  # tls:
  #   enabled: true
  #   cert_file: /etc/faircom_exporter/tls/server.crt
  #   key_file: /etc/faircom_exporter/tls/server.key
  
  # Basic authentication for metrics endpoint (optional)
  # Protects /metrics from unauthorized access
  # 
  basic_auth:
     username: ADMIN
     password: ADMIN

  # clientside TLS configuration (optional, recommended for production)
  tls:
     enabled:false
     ca_file: /etc/faircom_exporter/tls/ca.crt
  # client certificate authentcation (optional, replaces username & password)
  #  cert_file: /home/user/.keys/user.crt
  #  key_file: /home/user/.keys/user.key
  
  

# ============================================================================
# Collector Configuration
# ============================================================================
# Enable or disable specific metric collectors
# Most collectors are enabled by default
# call_timings is disabled, as it requires additional Server side change to enable.
collectors:
  # Cache hit/miss counters (4 metrics)
  cache: true
  
  # IO metrics: read/write counts and size for disk, ipc, and transaction log (12 metrics)
  io: true 

  # Transaction metrics: begins, commits, aborts, timing (8 metrics)
  transactions: true
  
  # Lock metrics: held, hit/miss counts, deadlocks (6 metrics)
  locks: true
 
  # File metrics: open files, operations (11 metrics)
  files: true
  
  # ISAM operation metrics: adds, deletes, reads (4 metrics)
  isam: true
  
  # SQL operation metrics: SELECT, INSERT, UPDATE, etc. (6 metrics)
  sql: true
  
  # User connection counts (2 metrics)
  users: true

  # call timings for isam ipc calls. (4 metrics) Requires server configuration DIAGNOSTICS SNAPSHOT_WORKTIME in ctsrvr.cfg:
  call_timings: true

# ============================================================================
# Logging Configuration
# ============================================================================
log:
  # Log level: debug, info, warn, error
  level: info
  
  # Log format: text or json
  # Use json for structured logging in production
  format: text
  
  # Log file path (default: /var/log/faircom_exporter/faircom_exporter.log)
  file: /var/log/faircom_exporter/faircom_exporter.log
  
  # Maximum size in megabytes before rotation (default: 100)
  max_size: 100
  
  # Maximum number of old log files to keep (default: 3)
  max_backups: 3
  
  # Maximum days to retain old log files (default: 28)
  max_age: 28
  
  # Compress rotated files (default: true)
  compress: true
