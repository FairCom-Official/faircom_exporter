# Server configuration
server:
  port: 9100
  path: /metrics
  # TLS configuration (optional)
  # tls:
  #   enabled: false
  #   cert_file: /path/to/cert.pem
  #   key_file: /path/to/key.pem
  # Basic auth for metrics endpoint (optional)
  # basic_auth:
  #   username: prometheus
  #   password: secret

# FairCom database connection
faircom:
  username: ADMIN
  password: ADMIN
  # Path to ctstat binary (default: /opt/faircom/ctstat)
  ctstat_path: /opt/faircom/ctstat
  # Command timeout in seconds (default: 10)
  timeout: 10

# Collector configuration
collectors:
  cache: true
  transactions: true
  locks: true
  files: true
  isam: true
  sql: true
  users: true

# Logging configuration
log:
  level: info  # debug, info, warn, error
  format: json # json or text
  file: /var/log/faircom_exporter/faircom_exporter.log
  max_size: 100    # Max size in MB before rotation
  max_backups: 3   # Max number of old log files to keep
  max_age: 28      # Max days to retain old log files
  compress: true   # Compress rotated files
