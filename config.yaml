# Server configuration
server:
  port: 9101
  path: /metrics
  # TLS configuration (optional)
  # tls:
  #   enabled: false
  #   cert_file: /path/to/cert.pem
  #   key_file: /path/to/key.pem
  # Basic auth for metrics endpoint (optional)
  # basic_auth:
  #   username: prometheus
  #   password: secret

# FairCom database connection
faircom:
  servername: FAIRCOMS@localhost
  basic_auth:
      username: ADMIN
      password: ADMIN

  # clientside TLS configuration (optional, recommended for production)
  tls:
    enabled: false
    ca_file: /etc/faircom_exporter/tls/ca.crt
  # client certificate authentication (optional, replaces username & password)
    #cert_file: /etc/faircom_exporter/tls/user.crt
    #key_file: /etc/faircom_exporter/tls/user.key
    

# Collector configuration
collectors:
  cache: true
  transactions: true
  locks: true
  files: true
  isam: true
  users: true
  io: true
  sql: true
  # call time requires DIAGNOSTICS SNAPSHOT_WORKTIME enabled by faircomDB server configuration (in ctsrvr.cfg)
  call_time: false


# Logging configuration
log:
  level: info  # debug, info, warn, error
  format: json # json or text
  file: /var/log/faircom_exporter/faircom_exporter.log
  max_size: 100    # Max size in MB before rotation
  max_backups: 3   # Max number of old log files to keep
  max_age: 28      # Max days to retain old log files
  compress: true   # Compress rotated files
